name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # Vite .env aur Android properties dono jagah Supabase keys write karna
      - name: Inject Supabase Environment Variables
        run: |
          # 1. Root .env file (Vite ke liye)
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

          # 2. Agar frontend kisi subfolder me ho to wahan bhi copy
          cp .env app/ || true

          # 3. Android Gradle properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "supabaseUrl=${{ secrets.SUPABASE_URL }}" >> gradle.properties
          echo "supabaseKey=${{ secrets.SUPABASE_ANON_KEY }}" >> gradle.properties

      # Production Keystore Generate karna
      - name: Create Production Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MyStorePass123 \
            -keypass MyStorePass123 \
            -dname "CN=Sndmart, OU=Mobile, O=Sndmart, L=Sindhanur, S=Karnataka, C=IN"
          cp release.keystore app/release.keystore

      # Build APK
      - name: Build APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle assembleRelease \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            -x test \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=MyStorePass123 \
            -Pandroid.injected.signing.key.alias=releaseKey \
            -Pandroid.injected.signing.key.password=MyStorePass123

      # Build App Bundle (AAB)
      - name: Build App Bundle (AAB)
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle bundleRelease \
            --no-daemon \
            -x lint \
            -x lintVitalRelease \
            -x test \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=MyStorePass123 \
            -Pandroid.injected.signing.key.alias=releaseKey \
            -Pandroid.injected.signing.key.password=MyStorePass123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Backup Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: production-keystore
          path: release.keystore
          
