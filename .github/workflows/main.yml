name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # Naya release keystore generate karne ka step
      - name: Generate Production Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MyStorePass123 \
            -keypass MyStorePass123 \
            -dname "CN=AppOwner, OU=Mobile, O=App, L=City, S=State, C=IN"

      - name: Build APK
        run: gradle assembleRelease

      - name: Build App Bundle (AAB)
        run: gradle bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # Keystore ko download ke liye save karna
      - name: Backup Keystore
        uses: actions/upload-artifact@v4
        with:
          name: production-keystore
          path: app/release.keystore
          
